# Retask Conexant SN6140 pin 0x18 as headphone jack.
# BIOS marks pin 0x18 as [N/A], which makes the HDA parser report hp_outs=0,
# so no "Headphones" output is created and the jack stays silent.
#
# Huawei MateBook YTG-XXX / M1010 (board YTG-XXX-PCB)
# codec: 0x14f11f87 (SN6140), subsystem: 0x19e53e6d
options snd_soc_hdac_hda patch=hda-jack-retask.fw
